openapi: 3.0.3
info:
  title: HRMS Platform API — Phase 0/1
  version: "0.1.0"
  description: >
    Core API surface for Phase 0/1: Auth/IAM, Core HR, Leave Management,
    Attendance. All endpoints are tenant-scoped via the authenticated JWT —
    tenant_id is never accepted as a request parameter.
servers:
  - url: https://api.yourhrms.com/api/v1
    description: Production
  - url: https://staging-api.yourhrms.com/api/v1
    description: Staging

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Client-generated UUID; required on all mutating requests.
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, default: 25, maximum: 100 }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }

    Employee:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        workEmail: { type: string, format: email }
        departmentId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }
        managerEmployeeId: { type: string, format: uuid, nullable: true }
        jobTitle: { type: string, nullable: true }
        employmentType: { type: string, enum: [full_time, part_time, contractor] }
        employmentStatus: { type: string, enum: [active, on_leave, terminated] }
        hireDate: { type: string, format: date }
        terminationDate: { type: string, format: date, nullable: true }
        customFields: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, employeeNumber, firstName, lastName, employmentType, employmentStatus, hireDate]

    EmployeeCreateRequest:
      type: object
      required: [firstName, lastName, hireDate, employmentType]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        personalEmail: { type: string, format: email }
        workEmail: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        managerEmployeeId: { type: string, format: uuid }
        jobTitle: { type: string }
        employmentType: { type: string, enum: [full_time, part_time, contractor] }
        hireDate: { type: string, format: date }
        customFields: { type: object, additionalProperties: true }

    Department:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        costCenter: { type: string, nullable: true }

    LeaveType:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        accrualDaysPerYear: { type: number }
        carryForwardMaxDays: { type: number }
        requiresApproval: { type: boolean }

    LeaveBalance:
      type: object
      properties:
        leaveTypeId: { type: string, format: uuid }
        year: { type: integer }
        accruedDays: { type: number }
        usedDays: { type: number }
        carriedOverDays: { type: number }
        remainingDays: { type: number }

    LeaveRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        leaveTypeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        daysRequested: { type: number }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        reason: { type: string, nullable: true }
        submittedVia: { type: string, enum: [web, mobile, ai_agent] }
        createdAt: { type: string, format: date-time }

    LeaveRequestCreate:
      type: object
      required: [leaveTypeId, startDate, endDate]
      properties:
        leaveTypeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }

    LeaveDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        decisionNote: { type: string }

    AttendanceClockIn:
      type: object
      properties:
        source: { type: string, enum: [web, mobile, biometric], default: web }
        geo:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }

    AttendanceRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        clockInAt: { type: string, format: date-time }
        clockOutAt: { type: string, format: date-time, nullable: true }
        totalMinutes: { type: integer, nullable: true }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorType: { type: string, enum: [user, ai_agent, system] }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CountByName:
      type: object
      properties:
        id: { type: string, format: uuid, nullable: true }
        name: { type: string, nullable: true }
        count: { type: integer }

    HeadcountReport:
      type: object
      properties:
        total: { type: integer }
        byDepartment:
          type: array
          items: { $ref: "#/components/schemas/CountByName" }
        byLocation:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/CountByName" }
              - type: object
                properties:
                  country: { type: string, nullable: true }
        byEmploymentType:
          type: array
          items:
            type: object
            properties:
              employmentType: { type: string }
              count: { type: integer }

    AttendanceSummary:
      type: object
      properties:
        totalEmployees: { type: integer }
        totalClockIns: { type: integer }
        totalMinutes: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: string, format: uuid }
              employeeNumber: { type: string }
              firstName: { type: string }
              lastName: { type: string }
              departmentName: { type: string, nullable: true }
              clockIns: { type: integer }
              totalMinutes: { type: integer }

    LeaveSummaryRow:
      type: object
      properties:
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        balances:
          type: array
          items:
            type: object
            properties:
              leaveTypeId: { type: string, format: uuid }
              leaveTypeName: { type: string }
              accruedDays: { type: number }
              usedDays: { type: number }
              carriedOverDays: { type: number }
              remainingDays: { type: number }

    JobOpening:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        departmentId: { type: string, format: uuid, nullable: true }
        departmentName: { type: string, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }
        locationName: { type: string, nullable: true }
        employmentType: { type: string }
        salaryMin: { type: string, nullable: true }
        salaryMax: { type: string, nullable: true }
        currency: { type: string }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        headcount: { type: integer }
        status: { type: string, enum: [draft, pending_approval, open, on_hold, closed] }
        createdAt: { type: string }
        updatedAt: { type: string }

    JobOpeningInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        departmentId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }
        employmentType: { type: string, enum: [full_time, part_time, contractor], default: full_time }
        salaryMin: { type: number, nullable: true }
        salaryMax: { type: number, nullable: true }
        currency: { type: string, default: USD }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        headcount: { type: integer, default: 1 }
        status: { type: string, enum: [draft, pending_approval], default: draft }
        createdBy: { type: string, format: uuid, nullable: true }

    JobOpeningPatch:
      type: object
      properties:
        title: { type: string }
        departmentId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }
        employmentType: { type: string, enum: [full_time, part_time, contractor] }
        salaryMin: { type: number, nullable: true }
        salaryMax: { type: number, nullable: true }
        currency: { type: string }
        description: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        headcount: { type: integer }

    Candidate:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobOpeningId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        resumeText: { type: string, nullable: true }
        source: { type: string }
        stage: { type: string, enum: [sourced, applied, screening, interview, offer, hired, rejected] }
        rating: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        hiredEmployeeId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }

    CandidateInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        resumeText: { type: string, nullable: true }
        source: { type: string, enum: [referral, job_board, linkedin, careers_page, agency, other], default: other }
        rating: { type: integer, nullable: true }
        notes: { type: string, nullable: true }

    CandidatePatch:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        resumeText: { type: string, nullable: true }
        source: { type: string, enum: [referral, job_board, linkedin, careers_page, agency, other] }
        rating: { type: integer, nullable: true }
        notes: { type: string, nullable: true }

    OnboardingTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [onboarding, offboarding] }
        description: { type: string, nullable: true }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        taskCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    OnboardingTemplateTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category:
          type: string
          enum: [it_provisioning, paperwork, training, access, asset, exit_interview, settlement, general]
        position: { type: integer }
        optional: { type: boolean }

    OnboardingTemplateDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [onboarding, offboarding] }
        description: { type: string, nullable: true }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        taskCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/OnboardingTemplateTask" }

    OnboardingTemplateInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [onboarding, offboarding] }
        description: { type: string, nullable: true }
        isDefault: { type: boolean, default: false }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/OnboardingTemplateTaskInput" }

    OnboardingTemplateTaskInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        category:
          type: string
          enum: [it_provisioning, paperwork, training, access, asset, exit_interview, settlement, general]
          default: general
        position: { type: integer, default: 0 }
        optional: { type: boolean, default: false }

    OnboardingTemplatePatch:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [onboarding, offboarding] }
        description: { type: string, nullable: true }
        isDefault: { type: boolean }
        isActive: { type: boolean }

    OnboardingPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string, nullable: true }
        kind: { type: string, enum: [onboarding, offboarding] }
        templateId: { type: string, format: uuid }
        templateName: { type: string }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        source: { type: string, enum: [manual, system] }
        startedAt: { type: string }
        completedAt: { type: string, nullable: true }
        totalTasks: { type: integer }
        completedTasks: { type: integer }
        progressPercent: { type: integer }

    OnboardingPlanTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category:
          type: string
          enum: [it_provisioning, paperwork, training, access, asset, exit_interview, settlement, general]
        position: { type: integer }
        optional: { type: boolean }
        status: { type: string, enum: [pending, in_progress, completed, skipped] }
        notes: { type: string, nullable: true }
        completedBy: { type: string, format: uuid, nullable: true }
        completedAt: { type: string, nullable: true }

    OnboardingPlanDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string, nullable: true }
        kind: { type: string, enum: [onboarding, offboarding] }
        templateId: { type: string, format: uuid }
        templateName: { type: string }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        source: { type: string, enum: [manual, system] }
        startedAt: { type: string }
        completedAt: { type: string, nullable: true }
        totalTasks: { type: integer }
        completedTasks: { type: integer }
        progressPercent: { type: integer }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/OnboardingPlanTask" }

    OnboardingPlanCreate:
      type: object
      required: [employeeId, templateId]
      properties:
        employeeId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }

    OnboardingPlanTaskStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, in_progress, completed, skipped] }
        notes: { type: string, nullable: true }

    OnboardingPlanTaskUpdate:
      type: object
      allOf:
        - $ref: "#/components/schemas/OnboardingPlanDetail"
        - type: object
          required: [task]
          properties:
            task: { $ref: "#/components/schemas/OnboardingPlanTask" }

paths:
  /tenants/signup:
    post:
      summary: Self-service tenant signup — provisions a tenant, seeds defaults, and auto-logs-in the admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName, subdomain, adminEmail, adminPassword, adminFirstName, adminLastName]
              properties:
                companyName: { type: string, maxLength: 160 }
                subdomain:
                  type: string
                  pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
                  description: Globally unique tenant subdomain (lowercase, 3-63 chars)
                adminEmail: { type: string, format: email }
                adminPassword: { type: string, format: password, minLength: 8 }
                adminFirstName: { type: string, maxLength: 120 }
                adminLastName: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Tenant provisioned; admin automatically signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
                  tenant:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      subdomain: { type: string }
                      plan: { type: string }
        "400":
          description: Invalid signup payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Subdomain already taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      summary: Authenticate and receive an access + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, tenantSubdomain]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                tenantSubdomain: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }

  /auth/me:
    get:
      summary: Get the current authenticated user and permission set
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string }
                  roles: { type: array, items: { type: string } }
                  permissions: { type: array, items: { type: string } }
                  employeeId: { type: string, format: uuid, nullable: true }

  /employees:
    get:
      summary: List employees (scoped by requester's permissions)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, on_leave, terminated] }
      responses:
        "200":
          description: Paginated employee list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Employee" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      summary: Create a new employee record
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeCreateRequest" }
      responses:
        "201":
          description: Employee created; emits `employee.hired` event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "403":
          description: Insufficient permissions (requires employee:write)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /employees/{employeeId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a single employee record
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      summary: Update an employee record (creates employment_history row if job_title/department/manager changes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
    delete:
      summary: Offboard an employee (soft delete; sets employmentStatus=terminated, emits `employee.terminated`)
      responses:
        "204":
          description: Offboarded

  /departments:
    get:
      summary: List departments
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Department" }
    post:
      summary: Create a department
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parentId: { type: string, format: uuid }
                costCenter: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }

  /leave-types:
    get:
      summary: List leave types configured for this tenant
      responses:
        "200":
          description: Leave type list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaveType" }

  /employees/{employeeId}/leave-balances:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get an employee's leave balances for the current year
      responses:
        "200":
          description: Leave balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaveBalance" }

  /leave-requests:
    get:
      summary: List leave requests (managers see their reports'; employees see their own)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled] }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated leave requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveRequest" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      summary: Submit a leave request (also callable by the AI Agent tool `submit_leave_request` on the employee's behalf)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveRequestCreate" }
      responses:
        "201":
          description: Created; emits `leave.requested`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "422":
          description: Insufficient leave balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leave-requests/{requestId}/decision:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Approve or reject a leave request (requires leave:approve)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaveDecision" }
      responses:
        "200":
          description: Decision recorded; emits `leave.approved` or `leave.rejected`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }

  /attendance/clock-in:
    post:
      summary: Clock in the authenticated employee
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceClockIn" }
      responses:
        "201":
          description: Clocked in; emits `attendance.clocked_in`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceRecord" }
        "409":
          description: Already clocked in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /attendance/clock-out:
    post:
      summary: Clock out the authenticated employee's open attendance record
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Clocked out; emits `attendance.clocked_out`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceRecord" }
        "404":
          description: No open clock-in found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /employees/{employeeId}/attendance:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List an employee's attendance records
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttendanceRecord" }

  /audit-logs:
    get:
      summary: List audit log entries (requires audit:read)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, ai_agent, system] }
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLogEntry" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }

  /reports/headcount:
    get:
      summary: Headcount by department, location and employment type (requires reporting:read)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, on_leave, terminated], default: active }
      responses:
        "200":
          description: Headcount breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeadcountReport" }
        "403":
          description: Insufficient permissions (requires reporting:read)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reports/attendance-summary:
    get:
      summary: Clock-ins and minutes worked per employee in a date range (requires reporting:read)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceSummary" }

  /reports/leave-summary:
    get:
      summary: Accrued/used/remaining leave balances per employee for a year (requires reporting:read)
      parameters:
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Leave balance summary
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaveSummaryRow" }

  # ---------------------------------------------------------------------------
  # Phase 2 — Recruitment / ATS (requires ats:read / ats:write / ats:approve)
  # ---------------------------------------------------------------------------
  /job-openings:
    get:
      summary: List job openings (requires ats:read)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, pending_approval, open, on_hold, closed] }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paged job openings
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/JobOpening" }
        "403":
          description: Missing ats:read
    post:
      summary: Create a job opening (requires ats:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobOpeningInput" }
      responses:
        "201":
          description: Created opening
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOpening" }
        "400":
          description: Invalid payload
        "403":
          description: Missing ats:write
        "409":
          description: Idempotency-Key already used with a different request
  /job-openings/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Fetch a single job opening (requires ats:read)
      responses:
        "200":
          description: The opening
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOpening" }
        "404":
          description: Not found or outside this tenant
    patch:
      summary: Update editable opening fields (requires ats:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobOpeningPatch" }
      responses:
        "200":
          description: Updated opening
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOpening" }
        "403":
          description: Missing ats:write
        "404":
          description: Not found
    delete:
      summary: Soft-delete a job opening (requires ats:write)
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /job-openings/{jobId}/submit:
    post:
      summary: Request approval for a draft opening (requires ats:write)
      responses:
        "200":
          description: Opening now pending_approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOpening" }
        "409":
          description: Not in draft state
        "404":
          description: Not found
  /job-openings/{jobId}/decision:
    post:
      summary: Approve/reject/hold/close an opening (requires ats:approve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected, on_hold, closed]
                note: { type: string }
      responses:
        "200":
          description: Opening status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobOpening" }
        "403":
          description: Missing ats:approve
        "409":
          description: Decision not allowed in the current status
        "404":
          description: Not found
  /job-openings/{jobId}/candidates:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List candidates for an opening (requires ats:read)
      parameters:
        - name: stage
          in: query
          schema: { type: string, enum: [sourced, applied, screening, interview, offer, hired, rejected] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paged candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Candidate" }
    post:
      summary: Add a candidate to an opening (requires ats:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateInput" }
      responses:
        "201":
          description: Created candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "400":
          description: Invalid payload
        "404":
          description: Opening not found
        "409":
          description: Idempotency-Key already used with a different request
  /candidates/{candidateId}:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Fetch a single candidate (requires ats:read)
      responses:
        "200":
          description: The candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "404":
          description: Not found or outside this tenant
    patch:
      summary: Update candidate profile fields (requires ats:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidatePatch" }
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "403":
          description: Missing ats:write
        "404":
          description: Not found
    delete:
      summary: Soft-delete a candidate (requires ats:write)
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /candidates/{candidateId}/transition:
    post:
      summary: Move a candidate to another pipeline stage (requires ats:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum: [sourced, applied, screening, interview, offer, hired, rejected]
      responses:
        "200":
          description: Stage updated (hired only from offer; terminal stages are final)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
        "409":
          description: Transition not allowed
        "404":
          description: Not found

  /onboarding/templates:
    get:
      summary: List onboarding/offboarding templates (requires onboarding:read)
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [onboarding, offboarding] }
        - name: defaultOnly
          in: query
          schema: { type: boolean }
        - name: includeInactive
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paged templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OnboardingTemplate" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      summary: Create a template with its checklist (requires onboarding:write)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingTemplateInput" }
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTemplateDetail" }
        "400":
          description: Invalid payload
        "403":
          description: Missing onboarding:write

  /onboarding/templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Fetch a template with its tasks (requires onboarding:read)
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTemplateDetail" }
        "404":
          description: Not found or outside this tenant
    patch:
      summary: Update template fields (requires onboarding:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingTemplatePatch" }
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTemplateDetail" }
        "404":
          description: Not found
    delete:
      summary: Soft-delete a template (requires onboarding:write)
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /onboarding/templates/{templateId}/tasks:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Append a task to a template (requires onboarding:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingTemplateTaskInput" }
      responses:
        "201":
          description: Added task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTemplateTask" }
        "404":
          description: Template not found

  /onboarding/templates/{templateId}/tasks/{taskId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update a template task (requires onboarding:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                category:
                  type: string
                  enum: [it_provisioning, paperwork, training, access, asset, exit_interview, settlement, general]
                position: { type: integer }
                optional: { type: boolean }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTemplateTask" }
        "404":
          description: Template or task not found
    delete:
      summary: Remove a task from a template (requires onboarding:write)
      responses:
        "204":
          description: Deleted
        "404":
          description: Template not found

  /onboarding/plans:
    get:
      summary: List onboarding/offboarding plans (requires onboarding:read)
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [onboarding, offboarding] }
        - name: status
          in: query
          schema: { type: string, enum: [in_progress, completed, cancelled] }
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paged plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OnboardingPlan" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
    post:
      summary: Start a plan for an employee from a template snapshot (requires onboarding:write)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPlanCreate" }
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlanDetail" }
        "404":
          description: Employee or template not found

  /onboarding/plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Fetch a plan with its snapshot tasks (requires onboarding:read)
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlanDetail" }
        "404":
          description: Not found or outside this tenant

  /onboarding/plans/{planId}/tasks/{taskId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update a plan task's status; a plan auto-completes when all tasks are terminal (requires onboarding:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPlanTaskStatus" }
      responses:
        "200":
          description: Updated task (with the re-fetched plan alongside)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlanTaskUpdate" }
        "404":
          description: Plan or task not found
        "409":
          description: Plan is completed/cancelled and no longer accepts task changes

  /onboarding/plans/{planId}/cancel:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Cancel an in-progress plan (requires onboarding:write)
      responses:
        "200":
          description: Cancelled plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlanDetail" }
        "404":
          description: Not found
        "409":
          description: Plan is completed/cancelled and cannot be cancelled again
